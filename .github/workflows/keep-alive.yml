name: Keep Render Awake

on:
  schedule:
    - cron: '*/9 * * * *'  # Every 9 minutes (Render sleeps after 15 mins)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RaTrade Health
        run: |
          echo "Pinging https://ratrade.onrender.com/health"
          curl -fsS --max-time 30 https://ratrade.onrender.com/health || echo "health ping failed, trying /"
          curl -fsS --max-time 30 https://ratrade.onrender.com/ || echo "root ping failed"
          echo "Ping done at $(date -u)"
      - name: Ping Scanner (warm caches)
        run: |
          curl -fsS --max-time 30 https://ratrade.onrender.com/api/scanner/scan-all || echo "scanner ping failed"
          echo "Scanner ping done"
