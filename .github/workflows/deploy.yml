name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "Triggering Render deploy..."
          curl -fsS --max-time 10 -X POST "https://api.render.com/deploy?key=${{ secrets.RENDER_DEPLOY_KEY }}" || echo "Deploy trigger failed - add RENDER_DEPLOY_KEY secret or use manual deploy"
          echo "Done at $(date -u)"
