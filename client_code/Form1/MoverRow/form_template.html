<anvil-form container="FlowPanel" prop:role="rt-table-row">
  <anvil-component type="Label" name="symbol_label" bind:text="self.item['symbol']" prop:role="rt-cell-symbol"></anvil-component>
  <anvil-component type="Label" name="price_label" bind:text="self.item['price']" prop:role="rt-cell"></anvil-component>
  <anvil-component type="Label" name="change_label" bind:text="self.item['change']" prop:role="rt-cell"></anvil-component>
  <anvil-component type="Label" name="signal_label" bind:text="self.item['signal']" prop:role="rt-cell rt-signal"></anvil-component>
</anvil-form>
