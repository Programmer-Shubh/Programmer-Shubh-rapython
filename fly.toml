# RaTrade on Fly.io free tier: always-on (no sleep -> SL monitor + Dhan
# feed never die), Mumbai region (NSE latency), 3GB volume (SQLite survives).
app = "ratrade"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # CRITICAL for trading: never auto-stop (free allowance covers 1 machine 24/7)
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "60s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Persistent SQLite (trades/settings survive restarts/deploys)
[[mounts]]
  source = "ratrade_data"
  destination = "/data"

[env]
  DB_PATH = "/data/ratrade.db"
  MARKET_MODE = "auto"
