services:
  - type: web
    name: ratrade
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MARKET_MODE
        value: auto
      - key: DB_PATH
        value: /opt/render/project/src/data/ratrade.db
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DATABASE_URL
        value: ""
        sync: false
      # Fyers credentials (Render Dashboard > Environment me fill karo).
      # App ID format = <appId>-<appType> (e.g. VBZLF5380A-200).
      # Secret = MyAPI dashboard ka app secret. PIN optional (token refresh ke liye).
      # RATRADE_FYERS_SECRET / _SECRET_KEY bhi accepted (aliases).
      - key: RATRADE_FYERS_APP_ID
        sync: false
      - key: RATRADE_FYERS_SECRET_ID
        sync: false
      - key: RATRADE_FYERS_REDIRECT_URI
        value: "https://ratrade-iwi2.onrender.com/api/broker/fyers-callback"
        sync: false
      - key: RATRADE_FYERS_PIN
        sync: false
    # FREE persistence (no paid disk): set DATABASE_URL to a free Postgres
    # e.g. Supabase (supabase.com) or Neon (neon.tech) or Render Postgres.
    # Example: postgresql://user:pass@host:5432/dbname?sslmode=require
    # When set, ALL trades/history/settings survive deploys. When empty, uses SQLite file above (ephemeral on free tier).
    # Broker credentials as env vars SURVIVE redeploys (SQLite wipes on free tier).
    # Fill values once in Render Dashboard → Environment (never commit secrets).
    # Naming: RATRADE_<BROKER>_<FIELD>, e.g. RATRADE_FYERS_APP_ID.
    #   Fyers (MAIN broker): RATRADE_FYERS_APP_ID, RATRADE_FYERS_SECRET
    #     (+ RATRADE_FYERS_REDIRECT_URI, RATRADE_FYERS_PIN for auto-refresh)
    #   Bigul: RATRADE_BIGUL_CLIENT_ID, RATRADE_BIGUL_PASSWORD,
    #     RATRADE_BIGUL_API_KEY, RATRADE_BIGUL_TOTP_SECRET
    #   Webhook security: WEBHOOK_TOKEN (koi bhi lambi random string). Set karne
    #   par /api/webhook/* me header x-email-token ya ?token= compulsory ho jata
    #   hai. Bina iske koi bhi trade trigger kar sakta hai - production me set karo.
    #   NOTE: Fyers access token ~24h me expire hota hai - token-keeper use
    #   refresh_token + PIN se khud renew karta hai (Refresh Tokens button bhi
    #   hai). Env only saves re-typing IDs/secrets.
    autoDeploy: true
    # Render free tier has ephemeral filesystem - trades/data disappear on deploy/restart.
    # To persist trades, upgrade to Starter+ plan and uncomment disk config.
    # disk:
    #   name: ratrade-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
